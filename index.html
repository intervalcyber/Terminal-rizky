<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Terminal Rizky</title>
<style>
  :root{--bg:#0b0f14;--card:#141b24;--line:#1f2a37;--txt:#e6edf3;--mut:#8b98a5;--gold:#f5c542;--warn:#ff9f1c}
  *{box-sizing:border-box;margin:0}
  body{background:var(--bg);color:var(--txt);font-family:system-ui,sans-serif;padding-bottom:70px}
  header{padding:14px 16px;border-bottom:1px solid var(--line);font-weight:700}
  header small{color:var(--mut);font-weight:400;display:block}
  main{padding:14px}
  .tab{display:none}.tab.on{display:block}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
  .card h3{font-size:14px;color:var(--mut);margin-bottom:6px}
  .val{font-size:24px;font-weight:700}
  .badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;background:#2a2112;color:var(--warn);margin-top:6px}
  nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line)}
  nav button{flex:1;padding:14px 0;background:none;border:0;color:var(--mut);font-size:12px}
  nav button.on{color:var(--gold);font-weight:700}
</style>
</head>
<body>
<header>TERMINAL RIZKY <small>Versi awal · belum terhubung ke sumber data</small></header>
<main>
  <section class="tab on" id="pasar">
    <div class="card"><h3>XAUUSD</h3><div class="val">—</div><span class="badge">BELUM ADA DATA</span></div>
    <div class="card"><h3>DXY</h3><div class="val">—</div><span class="badge">BELUM ADA DATA</span></div>
    <div class="card"><h3>Bitcoin</h3><div class="val">—</div><span class="badge">BELUM ADA DATA</span></div>
  </section>
  <section class="tab" id="emas"><div class="card"><h3>Gold Intelligence</h3>Segera hadir (Tahap 4).</div></section>
  <section class="tab" id="makro"><div class="card"><h3>Macro</h3>Segera hadir (Tahap 5).</div></section>
  <section class="tab" id="kripto"><div class="card"><h3>Crypto</h3>Segera hadir (Tahap 6).</div></section>
  <section class="tab" id="jurnal"><div class="card"><h3>Jurnal</h3>Segera hadir (Tahap 7).</div></section>
</main>
<nav>
  <button class="on" data-t="pasar">Pasar</button>
  <button data-t="emas">Emas</button>
  <button data-t="makro">Makro</button>
  <button data-t="kripto">Kripto</button>
  <button data-t="jurnal">Jurnal</button>
</nav>
<script>
  document.querySelectorAll('nav button').forEach(b=>{
    b.onclick=()=>{
      document.querySelectorAll('nav button,.tab').forEach(e=>e.classList.remove('on'));
      b.classList.add('on');
      document.getElementById(b.dataset.t).classList.add('on');
    };
  });
</script>
  <script src="data.js"></script>
</body>
    </html>
